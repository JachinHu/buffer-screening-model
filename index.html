<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jachin工具集</title>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>

<div class="top">
  <div class="inner">
    <div class="mark"><i></i>Lab Tools</div>
    <h1>Jachin工具集</h1>
    <div class="lead">工具页面集合。独立静态页，无需安装，数据不上传。</div>
  </div>
</div>

<div class="shell">

  <div id="sectLive">
    <div class="sect-hd">
      <h2>工具</h2>
      <span class="cnt" id="cntLive"></span>
      <span class="line"></span>
    </div>
    <div class="list" id="gridLive"></div>
  </div>

  <div id="sectDocs" style="margin-top:32px">
    <div class="sect-hd">
      <h2>资料</h2>
      <span class="line"></span>
    </div>
    <div class="doclist" id="docList"></div>
  </div>

  <div class="note">
    <div class="hd">添加工具 <span class="k">assets/tools.js</span></div>
    页面放到 <code>tools/</code>，在 <code>TOOLS</code> 数组里登记一条，首页会自动生成卡片。
  </div>

</div>

<footer>
  <span>实验室工具集</span>
  <span class="sep">/</span>
  <span>2026-10</span>
  <span class="sep">/</span>
  <a href="https://github.com/JachinHu/buffer-screening-model">GitHub 仓库</a>
</footer>

<script src="assets/tools.js"></script>
</body>
</html>
